<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Gestión de Firewalls</title>
    <!-- Tailwind CSS para un diseño moderno y responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">
    
    <div class="max-w-7xl mx-auto">
        <!-- Encabezado -->
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold tracking-tight text-white mb-2">🛡️ Panel de Gestión de Firewalls</h1>
            <p class="text-slate-400">Haz clic en cualquier tarjeta activa para acceder a su consola de administración HTTPS.</p>
        </header>

        <!-- Grid de Firewalls -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6" id="firewall-grid">
            <!-- El contenido se inyecta dinámicamente con JavaScript -->
        </div>
    </div>

    <script>
        // Lista de firewalls con sus respectivas IPs
        const firewalls = [
            { name: "Firewall Mintic Ortezal 1", ip: "172.27.240.148" },
            { name: "Firewall Mintic Ortezal 2", ip: "172.27.240.150" },
            { name: "Firewall Mintic Ingenio 1", ip: "172.27.240.172" },
            { name: "Firewall Mintic Ingenio 2", ip: "172.27.240.174" },
            { name: "BOGOTA1", ip: "172.25.181.250" },
            { name: "BOGOTA2", ip: null },
            { name: "Albuquerque1", ip: "172.25.181.234" },
            { name: "Albuquerque2", ip: null },
            { name: "Billings1", ip: "172.25.181.202" },
            { name: "Billings2", ip: null },
            { name: "North Place1", ip: "172.25.181.226" },
            { name: "North Place2", ip: null },
            { name: "Riverside1", ip: "172.25.181.242" },
            { name: "Riverside2", ip: null },
            { name: "Santa Clara1", ip: "172.25.181.218" },
            { name: "Santa Clara2", ip: null },
            { name: "Seattle1", ip: "172.25.181.210" },
            { name: "Seattle2", ip: null },
            { name: "Virginia1", ip: "172.28.144.2" },
            { name: "Virginia2", ip: null },
            { name: "Peru1", ip: "172.28.136.202" },
            { name: "Peru2", ip: null },
            { name: "Brasil1", ip: "172.28.121.250" },
            { name: "Brasil2", ip: null }
        ];

        const grid = document.getElementById('firewall-grid');

        firewalls.forEach(fw => {
            const card = document.createElement('div');
            
            if (fw.ip) {
                // Tarjeta Activa (con IP)
                card.className = "bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-lg hover:bg-slate-750 hover:border-emerald-500 transition-all duration-200 cursor-pointer flex flex-col justify-between group";
                card.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between mb-3">
                            <div class="p-3 bg-emerald-500/10 text-emerald-400 rounded-lg group-hover:bg-emerald-500 group-hover:text-white transition-colors">
                                <!-- Icono de Firewall/Escudo -->
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                                </svg>
                            </div>
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800">
                                Activo
                            </span>
                        </div>
                        <h3 class="font-semibold text-white text-lg mb-1 group-hover:text-emerald-400 transition-colors">${fw.name}</h3>
                        <p class="text-sm text-slate-400 font-mono">${fw.ip}</p>
                    </div>
                    <div class="mt-4 pt-3 border-t border-slate-700/60 flex items-center justify-between text-xs text-emerald-400 font-medium">
                        <span>Conectar vía HTTPS</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 transform group-hover:translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                        </svg>
                    </div>
                `;
                // Al hacer clic abre en una nueva pestaña usando https://
                card.addEventListener('click', () => {
                    window.open(`https://${fw.ip}`, '_blank');
                });
            } else {
                // Tarjeta Inactiva / Sin IP asignada
                card.className = "bg-slate-800/50 border border-slate-800 rounded-xl p-5 opacity-60 flex flex-col justify-between";
                card.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between mb-3">
                            <div class="p-3 bg-slate-700 text-slate-400 rounded-lg">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636" />
                                </svg>
                            </div>
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-slate-700 text-slate-300">
                                Sin IP
                            </span>
                        </div>
                        <h3 class="font-semibold text-slate-300 text-lg mb-1">${fw.name}</h3>
                        <p class="text-sm text-slate-500 italic">IP pendiente de configurar</p>
                    </div>
                `;
            }

            grid.appendChild(card);
        });
    </script>
</body>
</html>
